<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <!--
      Applies the resolved theme before any CSS/JS loads, to avoid a
      flash of the wrong theme. Mirrors resolveTheme() in
      src/composables/useTheme.ts -- kept deliberately tiny and
      duplicated rather than imported, since it has to run standalone
      before any module graph exists.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('rechnungsabgleich:theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
